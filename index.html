<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="SelfImpulse — an on-device AI captain that governs, executes and verifies every action." />
    <meta name="theme-color" content="#0B0B0D" />
    <title>SelfImpulse — Intelligence Meets Collaboration</title>
    <link rel="icon" href="/brand/si-appicon.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/brand/si-appicon.jpg" />
    <script>
      // Boot: resolve the theme before the stylesheet paints, and surface errors early.
      (function(){
        try {
          var t = localStorage.getItem("vh.theme.v2");
          // Whitelisted rather than trusted: an unknown id would paint an
          // unstyled ground, and a retired id must fall back, not be guessed.
          var ok = ["dark","heliotrope","light","charleston","licorice","bistre","feldgrau"];
          document.documentElement.dataset.theme = ok.indexOf(t) > -1 ? t : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
        window.addEventListener('error', function(e){ console.error('[si]', e.message); });
        window.addEventListener('unhandledrejection', function(e){ console.error('[si]', e.reason); });
      })();
    </script>
    <!-- The ground is set here as well as in ink.css because this block paints
         before the stylesheet loads. The two must agree. -->
    <style>html,body{margin:0;padding:0;background:#000100}html[data-theme="light"],html[data-theme="light"] body{background:#EBEEE9}html[data-theme="charleston"],html[data-theme="charleston"] body{background:#232B2B}html[data-theme="licorice"],html[data-theme="licorice"] body{background:#1A1110}html[data-theme="bistre"],html[data-theme="bistre"] body{background:#3D2B1F}html[data-theme="feldgrau"],html[data-theme="feldgrau"] body{background:#E4E7E1}html[data-theme="heliotrope"],html[data-theme="heliotrope"] body{background:#000100}#root{min-height:100vh}</style>  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
